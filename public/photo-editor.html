<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>EditO — Photo Editor</title>
<style>
:root {
    --bg: #0E0E10;
    --surface: #16161A;
    --surface-2: #1F1F24;
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.14);
    --text: #F2F2F4;
    --text-dim: #8A8A93;
    --text-mute: #5C5C66;
    --accent: #FFB84A;
    --accent-soft: rgba(255,184,74,0.12);
    --danger: #FF5A5F;
    --sheet-peek: 96px;
    --sheet-full: 320px;
    --topbar-h: 56px;
    --tabbar-h: 64px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
    --ease: cubic-bezier(.22,1,.36,1);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro", "Segoe UI", "Noto Sans KR", sans-serif; user-select: none; -webkit-user-select: none; }
button { font-family: inherit; color: inherit; border: 0; background: transparent; cursor: pointer; padding: 0; }
input, select { font-family: inherit; }

/* ===== App shell ===== */
.app {
    height: 100dvh;
    display: grid;
    grid-template-rows: calc(var(--topbar-h) + var(--safe-top)) 1fr auto calc(var(--tabbar-h) + var(--safe-bottom));
}

/* ===== Top bar ===== */
.topbar {
    padding: var(--safe-top) 16px 0;
    display: flex;
    align-items: center;
    gap: 4px;
    background: linear-gradient(180deg, rgba(14,14,16,0.96), rgba(14,14,16,0.72) 70%, transparent);
    position: relative;
    z-index: 30;
}
.topbar .spacer { flex: 1; }
.icon-btn {
    width: 44px; height: 44px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 12px;
    color: var(--text);
    transition: background .12s var(--ease), opacity .12s;
}
.icon-btn:hover { background: rgba(255,255,255,0.06); }
.icon-btn:disabled { opacity: 0.35; }
.icon-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.save-btn {
    height: 38px; padding: 0 16px;
    border-radius: 999px;
    background: var(--accent);
    color: #1A0F00;
    font-weight: 700; font-size: 14px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: transform .1s var(--ease), filter .1s;
}
.save-btn:hover { filter: brightness(1.05); }
.save-btn:active { transform: scale(0.97); }

/* ===== Canvas ===== */
.canvas-wrap {
    position: relative;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #18181C 0%, var(--bg) 70%);
    touch-action: none;
}
.canvas-stage {
    max-width: 92%; max-height: 92%;
    position: relative;
    transition: transform .12s var(--ease);
}
.canvas-img {
    display: block;
    max-width: 100%; max-height: 100%;
    border-radius: 8px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    will-change: filter, transform;
}
.empty-state {
    color: var(--text-mute);
    text-align: center;
    padding: 32px;
    display: flex; flex-direction: column; gap: 12px; align-items: center;
}
.empty-state .ico { font-size: 48px; opacity: 0.5; }
.empty-state .pick {
    margin-top: 8px;
    height: 44px; padding: 0 20px;
    border-radius: 999px;
    background: var(--accent); color: #1A0F00;
    font-weight: 700; font-size: 14px;
}

/* Floating value badge while dragging slider */
.value-badge {
    position: absolute;
    top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(20,20,24,0.92);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity .14s var(--ease);
}
.value-badge.show { opacity: 1; }

/* ===== Bottom sheet ===== */
.sheet {
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-radius: 20px 20px 0 0;
    overflow: hidden;
    transition: height .32s var(--ease);
    height: var(--sheet-peek);
    position: relative;
    z-index: 20;
}
.sheet.expanded { height: var(--sheet-full); }
.sheet-handle {
    height: 18px; display: flex; align-items: center; justify-content: center;
    cursor: grab;
}
.sheet-handle::before {
    content: ''; width: 36px; height: 4px; border-radius: 999px;
    background: var(--border-strong);
}
.sheet-body {
    padding: 0 8px 16px;
    height: calc(100% - 18px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}
.sheet-panel {
    display: none;
    animation: fadeUp .22s var(--ease);
}
.sheet-panel.active { display: block; }
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
}

/* Adjust sliders */
.adjust-list { display: flex; flex-direction: column; gap: 4px; padding: 4px 8px; }
.adjust-row {
    padding: 10px 4px;
}
.adjust-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 8px;
}
.adjust-label {
    font-size: 13px; font-weight: 500; color: var(--text-dim);
    letter-spacing: 0.2px;
}
.adjust-value {
    font-size: 13px; font-weight: 700; color: var(--text);
    font-variant-numeric: tabular-nums;
    min-width: 36px; text-align: right;
}
.adjust-value.changed { color: var(--accent); }

input[type="range"].slider {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 44px; background: transparent;
    margin: 0; padding: 0;
}
input[type="range"].slider::-webkit-slider-runnable-track {
    height: 4px; border-radius: 999px;
    background: linear-gradient(to right, var(--accent) var(--fill, 50%), rgba(255,255,255,0.12) var(--fill, 50%));
}
input[type="range"].slider::-moz-range-track {
    height: 4px; border-radius: 999px; background: rgba(255,255,255,0.12);
}
input[type="range"].slider::-moz-range-progress {
    height: 4px; border-radius: 999px; background: var(--accent);
}
input[type="range"].slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: #fff;
    border: 2px solid var(--accent);
    margin-top: -9px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.35);
    cursor: pointer;
    transition: transform .1s var(--ease);
}
input[type="range"].slider:active::-webkit-slider-thumb { transform: scale(1.15); }
input[type="range"].slider::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: #fff; border: 2px solid var(--accent);
    box-shadow: 0 1px 6px rgba(0,0,0,0.35);
    cursor: pointer;
}

/* Filter carousel */
.filter-rail {
    display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden;
    padding: 12px 16px 16px;
    scroll-snap-type: x mandatory;
    -ms-overflow-style: none; scrollbar-width: none;
}
.filter-rail::-webkit-scrollbar { display: none; }
.filter-tile {
    flex: 0 0 76px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    scroll-snap-align: start;
}
.filter-thumb {
    width: 72px; height: 72px;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid transparent;
    background: var(--surface-2);
    position: relative;
    transition: border-color .14s var(--ease), transform .14s var(--ease);
}
.filter-thumb.active {
    border-color: var(--accent);
    transform: scale(1.02);
}
.filter-thumb img, .filter-thumb canvas {
    width: 100%; height: 100%; object-fit: cover; display: block;
}
.filter-name {
    font-size: 11px; font-weight: 500; color: var(--text-dim);
    letter-spacing: 0.2px;
}
.filter-tile.active .filter-name { color: var(--accent); }

/* Crop ratios */
.chip-row {
    display: flex; gap: 8px; padding: 14px 16px; flex-wrap: wrap;
}
.chip {
    height: 36px; padding: 0 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-dim);
    font-size: 13px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 44px;
}
.chip.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
}

/* AI grid */
.ai-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    padding: 14px 16px;
}
.ai-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: flex; flex-direction: column; gap: 8px;
    text-align: left;
    transition: background .14s var(--ease), border-color .14s var(--ease), transform .1s;
    min-height: 96px;
}
.ai-card:hover { background: #23232A; border-color: var(--border-strong); }
.ai-card:active { transform: scale(0.98); }
.ai-card .ico {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 18px;
}
.ai-card .title { font-size: 14px; font-weight: 700; color: var(--text); }
.ai-card .desc { font-size: 11px; color: var(--text-mute); line-height: 1.4; }
.ai-card.featured {
    border-color: var(--accent);
    background: linear-gradient(140deg, var(--accent-soft), transparent 60%);
}

/* Text panel */
.text-panel { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
.text-input {
    width: 100%; height: 44px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 0 14px;
    color: var(--text); font-size: 14px;
    outline: none;
}
.text-input:focus { border-color: var(--accent); }
.font-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.font-row::-webkit-scrollbar { display: none; }
.font-chip {
    flex: 0 0 auto; height: 36px; min-height: 44px; padding: 0 14px;
    border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text);
    font-size: 14px; font-weight: 600;
}
.font-chip.active { border-color: var(--accent); color: var(--accent); }
.color-row { display: flex; gap: 10px; }
.color-dot {
    width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid transparent;
    min-width: 44px; min-height: 44px;
    background-clip: content-box;
    padding: 8px;
    background-origin: content-box;
    display: inline-flex;
}
.color-dot.active { border-color: var(--accent); }

/* ===== Tab bar ===== */
.tabbar {
    padding-bottom: var(--safe-bottom);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: grid; grid-template-columns: repeat(5, 1fr);
    height: calc(var(--tabbar-h) + var(--safe-bottom));
    position: relative;
    z-index: 25;
}
.tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; min-height: 44px;
    color: var(--text-mute);
    transition: color .14s var(--ease);
    position: relative;
}
.tab svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.tab .lbl { font-size: 10px; font-weight: 600; letter-spacing: 0.2px; }
.tab.active { color: var(--accent); }
.tab.active::before {
    content: ''; position: absolute; top: 0; left: 50%;
    transform: translateX(-50%);
    width: 22px; height: 2px; border-radius: 0 0 2px 2px;
    background: var(--accent);
}

/* Hidden file input */
#file { display: none; }

/* Reset button (small, inside adjust panel) */
.reset-bar {
    display: flex; justify-content: flex-end; padding: 6px 12px 0;
}
.reset-btn {
    font-size: 12px; font-weight: 600;
    color: var(--text-dim);
    padding: 8px 12px;
    border-radius: 8px;
    transition: color .12s, background .12s;
}
.reset-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }

/* Toast */
.toast {
    position: fixed; bottom: calc(var(--tabbar-h) + var(--sheet-peek) + 20px + var(--safe-bottom));
    left: 50%; transform: translate(-50%, 8px);
    background: rgba(20,20,24,0.96); backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity .22s var(--ease), transform .22s var(--ease);
    z-index: 50;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">

    <!-- TOP BAR -->
    <header class="topbar">
        <button class="icon-btn" aria-label="뒤로" id="back-btn">
            <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <button class="icon-btn" aria-label="되돌리기" id="undo-btn" disabled>
            <svg viewBox="0 0 24 24"><path d="M9 14l-4-4 4-4"/><path d="M5 10h11a4 4 0 014 4v0a4 4 0 01-4 4H9"/></svg>
        </button>
        <button class="icon-btn" aria-label="다시실행" id="redo-btn" disabled>
            <svg viewBox="0 0 24 24"><path d="M15 14l4-4-4-4"/><path d="M19 10H8a4 4 0 00-4 4v0a4 4 0 004 4h6"/></svg>
        </button>
        <div class="spacer"></div>
        <button class="save-btn" id="save-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>
            저장
        </button>
    </header>

    <!-- CANVAS -->
    <main class="canvas-wrap" id="canvas-wrap">
        <div class="value-badge" id="value-badge"></div>
        <div class="canvas-stage" id="canvas-stage">
            <img class="canvas-img" id="canvas-img" alt="" />
        </div>
        <div class="empty-state" id="empty-state">
            <div class="ico">🖼</div>
            <div>편집할 사진을 선택하세요</div>
            <button class="pick" id="pick-btn">사진 선택</button>
        </div>
    </main>
    <input type="file" id="file" accept="image/*">

    <!-- BOTTOM SHEET -->
    <section class="sheet" id="sheet">
        <div class="sheet-handle" id="sheet-handle"></div>
        <div class="sheet-body">

            <!-- 조정 -->
            <div class="sheet-panel active" data-panel="adjust">
                <div class="reset-bar">
                    <button class="reset-btn" id="reset-adjust">초기화</button>
                </div>
                <div class="adjust-list" id="adjust-list">
                    <!-- 슬라이더는 JS로 렌더 -->
                </div>
            </div>

            <!-- 필터 -->
            <div class="sheet-panel" data-panel="filter">
                <div class="filter-rail" id="filter-rail"></div>
            </div>

            <!-- 자르기 -->
            <div class="sheet-panel" data-panel="crop">
                <div class="chip-row" id="ratio-row">
                    <button class="chip active" data-ratio="free">자유</button>
                    <button class="chip" data-ratio="1:1">1:1</button>
                    <button class="chip" data-ratio="4:5">4:5</button>
                    <button class="chip" data-ratio="3:4">3:4</button>
                    <button class="chip" data-ratio="16:9">16:9</button>
                    <button class="chip" data-ratio="9:16">9:16</button>
                </div>
                <div class="adjust-list" style="padding: 0 8px;">
                    <div class="adjust-row">
                        <div class="adjust-head">
                            <span class="adjust-label">회전</span>
                            <span class="adjust-value" id="rotate-val">0°</span>
                        </div>
                        <input type="range" class="slider" id="rotate-slider" min="-45" max="45" value="0" step="1">
                    </div>
                </div>
            </div>

            <!-- AI -->
            <div class="sheet-panel" data-panel="ai">
                <div class="ai-grid">
                    <button class="ai-card featured" data-ai="autotune">
                        <div class="ico">✨</div>
                        <div class="title">자동 보정</div>
                        <div class="desc">1탭으로 노출·화이트밸런스 최적화</div>
                    </button>
                    <button class="ai-card" data-ai="bg-remove">
                        <div class="ico">🪄</div>
                        <div class="title">배경 제거</div>
                        <div class="desc">피사체만 깨끗하게 추출</div>
                    </button>
                    <button class="ai-card" data-ai="magic-eraser">
                        <div class="ico">🧽</div>
                        <div class="title">매직 지우개</div>
                        <div class="desc">원치 않는 물체 자연스럽게 삭제</div>
                    </button>
                    <button class="ai-card" data-ai="generative-fill">
                        <div class="ico">🎨</div>
                        <div class="title">생성형 채우기</div>
                        <div class="desc">프롬프트로 새 요소 추가</div>
                    </button>
                </div>
            </div>

            <!-- 텍스트 -->
            <div class="sheet-panel" data-panel="text">
                <div class="text-panel">
                    <input type="text" class="text-input" id="text-input" placeholder="텍스트 입력">
                    <div class="font-row">
                        <button class="font-chip active" style="font-family:-apple-system,sans-serif">Sans</button>
                        <button class="font-chip" style="font-family:Georgia,serif">Serif</button>
                        <button class="font-chip" style="font-family:'Courier New',monospace">Mono</button>
                        <button class="font-chip" style="font-weight:900">Bold</button>
                        <button class="font-chip" style="font-style:italic">Italic</button>
                    </div>
                    <div class="color-row">
                        <button class="color-dot active" style="background:#FFFFFF"></button>
                        <button class="color-dot" style="background:#000000"></button>
                        <button class="color-dot" style="background:#FFB84A"></button>
                        <button class="color-dot" style="background:#FF5A5F"></button>
                        <button class="color-dot" style="background:#4A90D9"></button>
                        <button class="color-dot" style="background:#2ECC71"></button>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- TAB BAR -->
    <nav class="tabbar" id="tabbar">
        <button class="tab active" data-tab="adjust">
            <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2.5"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2.5"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="11" cy="18" r="2.5"/></svg>
            <span class="lbl">조정</span>
        </button>
        <button class="tab" data-tab="filter">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="5"/><circle cx="15" cy="15" r="5"/></svg>
            <span class="lbl">필터</span>
        </button>
        <button class="tab" data-tab="crop">
            <svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 002 2h14"/><path d="M18 22V8a2 2 0 00-2-2H2"/></svg>
            <span class="lbl">자르기</span>
        </button>
        <button class="tab" data-tab="ai">
            <svg viewBox="0 0 24 24"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg>
            <span class="lbl">AI</span>
        </button>
        <button class="tab" data-tab="text">
            <svg viewBox="0 0 24 24"><path d="M5 7V5h14v2"/><line x1="12" y1="5" x2="12" y2="19"/><line x1="9" y1="19" x2="15" y2="19"/></svg>
            <span class="lbl">텍스트</span>
        </button>
    </nav>

</div>

<div class="toast" id="toast"></div>

<script>
// ============ State ============
const ADJUSTMENTS = [
    { key: 'exposure',  label: '노출',   min: -100, max: 100, def: 0, unit: '' },
    { key: 'contrast',  label: '대비',   min: -100, max: 100, def: 0, unit: '' },
    { key: 'saturation', label: '채도',  min: -100, max: 100, def: 0, unit: '' },
    { key: 'temperature', label: '온도', min: -100, max: 100, def: 0, unit: '' },
    { key: 'vignette',  label: '비네트', min: 0,    max: 100, def: 0, unit: '' },
];

const FILTERS = [
    { key: 'original', name: 'Original', css: '' },
    { key: 'mono',     name: 'Mono',     css: 'grayscale(1) contrast(1.05)' },
    { key: 'warm',     name: 'Warm',     css: 'saturate(1.1) sepia(0.18) brightness(1.04)' },
    { key: 'cool',     name: 'Cool',     css: 'saturate(1.05) hue-rotate(-12deg) brightness(1.02)' },
    { key: 'fade',     name: 'Fade',     css: 'saturate(0.78) contrast(0.92) brightness(1.05)' },
    { key: 'vivid',    name: 'Vivid',    css: 'saturate(1.35) contrast(1.12)' },
    { key: 'noir',     name: 'Noir',     css: 'grayscale(1) contrast(1.3) brightness(0.95)' },
    { key: 'film',     name: 'Film',     css: 'sepia(0.25) saturate(1.12) contrast(1.08)' },
];

const state = {
    adjust: Object.fromEntries(ADJUSTMENTS.map(a => [a.key, a.def])),
    filter: 'original',
    rotate: 0,
    ratio: 'free',
    activeTab: 'adjust',
    history: [],
    future: [],
};

// ============ DOM refs ============
const $ = id => document.getElementById(id);
const canvasImg = $('canvas-img');
const canvasStage = $('canvas-stage');
const emptyState = $('empty-state');
const sheet = $('sheet');
const valueBadge = $('value-badge');
const toast = $('toast');

// ============ Init ============
canvasImg.style.display = 'none';

renderAdjust();
renderFilters();

// ============ File picker ============
$('pick-btn').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        canvasImg.src = ev.target.result;
        canvasImg.style.display = 'block';
        emptyState.style.display = 'none';
        renderFilterThumbs();
        showToast('사진 불러오기 완료');
    };
    reader.readAsDataURL(file);
});

// Make canvas area itself clickable when empty
$('canvas-wrap').addEventListener('click', (e) => {
    if (emptyState.style.display !== 'none' && e.target !== $('pick-btn')) {
        $('file').click();
    }
});

// ============ Tab switching ============
document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => switchTab(t.dataset.tab));
});
function switchTab(name) {
    state.activeTab = name;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.sheet-panel').forEach(p => p.classList.toggle('active', p.dataset.panel === name));
    sheet.classList.add('expanded');
}

// ============ Sheet expand/collapse drag ============
let dragStartY = null, dragStartH = null;
const sheetHandle = $('sheet-handle');
sheetHandle.addEventListener('pointerdown', (e) => {
    dragStartY = e.clientY;
    dragStartH = sheet.getBoundingClientRect().height;
    sheetHandle.setPointerCapture(e.pointerId);
});
sheetHandle.addEventListener('pointermove', (e) => {
    if (dragStartY === null) return;
    const dy = dragStartY - e.clientY;
    const newH = Math.max(96, Math.min(420, dragStartH + dy));
    sheet.style.transition = 'none';
    sheet.style.height = newH + 'px';
});
sheetHandle.addEventListener('pointerup', (e) => {
    if (dragStartY === null) return;
    dragStartY = null;
    sheet.style.transition = '';
    const h = sheet.getBoundingClientRect().height;
    sheet.style.height = '';
    sheet.classList.toggle('expanded', h > 200);
});

// ============ Adjust panel ============
function renderAdjust() {
    const list = $('adjust-list');
    list.innerHTML = ADJUSTMENTS.map(a => `
        <div class="adjust-row">
            <div class="adjust-head">
                <span class="adjust-label">${a.label}</span>
                <span class="adjust-value" id="val-${a.key}">${a.def}</span>
            </div>
            <input type="range" class="slider" id="slider-${a.key}" min="${a.min}" max="${a.max}" value="${a.def}" step="1">
        </div>
    `).join('');
    ADJUSTMENTS.forEach(a => {
        const slider = $('slider-' + a.key);
        updateSliderFill(slider, a);
        slider.addEventListener('input', () => {
            state.adjust[a.key] = +slider.value;
            $('val-' + a.key).textContent = slider.value;
            $('val-' + a.key).classList.toggle('changed', +slider.value !== a.def);
            updateSliderFill(slider, a);
            applyFilters();
            showValueBadge(`${a.label}  ${slider.value > 0 ? '+' : ''}${slider.value}`);
        });
        slider.addEventListener('change', () => {
            pushHistory();
            hideValueBadge();
        });
        slider.addEventListener('pointerdown', () => showValueBadge(`${a.label}  ${slider.value > 0 ? '+' : ''}${slider.value}`));
        slider.addEventListener('pointerup', () => setTimeout(hideValueBadge, 600));
    });
}
function updateSliderFill(slider, a) {
    const pct = ((+slider.value - a.min) / (a.max - a.min)) * 100;
    slider.style.setProperty('--fill', pct + '%');
}

$('reset-adjust').addEventListener('click', () => {
    ADJUSTMENTS.forEach(a => {
        state.adjust[a.key] = a.def;
        const s = $('slider-' + a.key);
        s.value = a.def;
        $('val-' + a.key).textContent = a.def;
        $('val-' + a.key).classList.remove('changed');
        updateSliderFill(s, a);
    });
    applyFilters();
    pushHistory();
    showToast('초기화 완료');
});

// ============ Filter rail ============
function renderFilters() {
    const rail = $('filter-rail');
    rail.innerHTML = FILTERS.map(f => `
        <button class="filter-tile ${f.key === state.filter ? 'active' : ''}" data-filter="${f.key}">
            <div class="filter-thumb ${f.key === state.filter ? 'active' : ''}">
                <div class="thumb-inner" data-thumb="${f.key}" style="width:100%;height:100%;background:#2a2a30;"></div>
            </div>
            <div class="filter-name">${f.name}</div>
        </button>
    `).join('');
    rail.querySelectorAll('.filter-tile').forEach(tile => {
        tile.addEventListener('click', () => {
            state.filter = tile.dataset.filter;
            rail.querySelectorAll('.filter-tile').forEach(t => {
                t.classList.toggle('active', t === tile);
                t.querySelector('.filter-thumb').classList.toggle('active', t === tile);
            });
            applyFilters();
            pushHistory();
        });
    });
}
function renderFilterThumbs() {
    document.querySelectorAll('.thumb-inner').forEach(el => {
        const f = FILTERS.find(x => x.key === el.dataset.thumb);
        el.style.cssText = `width:100%;height:100%;background-image:url('${canvasImg.src}');background-size:cover;background-position:center;filter:${f.css}`;
    });
}

// ============ Crop panel ============
document.querySelectorAll('#ratio-row .chip').forEach(c => {
    c.addEventListener('click', () => {
        document.querySelectorAll('#ratio-row .chip').forEach(x => x.classList.toggle('active', x === c));
        state.ratio = c.dataset.ratio;
        applyRatio();
        pushHistory();
    });
});
function applyRatio() {
    if (state.ratio === 'free' || !canvasImg.naturalWidth) {
        canvasStage.style.aspectRatio = '';
        canvasStage.style.width = '';
        canvasImg.style.objectFit = '';
        return;
    }
    const [w, h] = state.ratio.split(':').map(Number);
    canvasStage.style.aspectRatio = `${w} / ${h}`;
    canvasStage.style.width = 'auto';
    canvasImg.style.objectFit = 'cover';
    canvasImg.style.width = '100%';
    canvasImg.style.height = '100%';
}

const rotateSlider = $('rotate-slider');
rotateSlider.addEventListener('input', () => {
    state.rotate = +rotateSlider.value;
    $('rotate-val').textContent = rotateSlider.value + '°';
    applyTransform();
    showValueBadge(`회전  ${rotateSlider.value}°`);
});
rotateSlider.addEventListener('change', () => { pushHistory(); setTimeout(hideValueBadge, 600); });

// ============ AI panel (demo actions) ============
document.querySelectorAll('.ai-card').forEach(card => {
    card.addEventListener('click', () => {
        const action = card.dataset.ai;
        runAI(action);
    });
});
function runAI(action) {
    if (!canvasImg.src) { showToast('먼저 사진을 선택하세요'); return; }
    if (action === 'autotune') {
        // simulate: nudge contrast/saturation
        state.adjust.contrast = 12; state.adjust.saturation = 8; state.adjust.exposure = 4;
        ADJUSTMENTS.forEach(a => {
            const s = $('slider-' + a.key); s.value = state.adjust[a.key];
            $('val-' + a.key).textContent = state.adjust[a.key];
            $('val-' + a.key).classList.toggle('changed', state.adjust[a.key] !== a.def);
            updateSliderFill(s, a);
        });
        applyFilters();
        pushHistory();
        showToast('✨ 자동 보정 적용됨');
    } else if (action === 'bg-remove') {
        canvasImg.style.background = 'repeating-conic-gradient(#2a2a30 0% 25%, #1a1a1d 0% 50%) 50% / 16px 16px';
        showToast('🪄 배경 제거 시뮬레이션 — 실제 구현에는 ML 모델 필요');
    } else if (action === 'magic-eraser') {
        showToast('🧽 매직 지우개 — 영역을 그려주세요 (데모)');
    } else if (action === 'generative-fill') {
        const prompt = window.prompt('프롬프트를 입력하세요', '바닷가 일몰');
        if (prompt) showToast('🎨 "' + prompt + '" 생성 중...');
    }
}

// ============ Apply filters/transform ============
function applyFilters() {
    const a = state.adjust;
    const exposure   = 1 + a.exposure / 200;   // 0.5 ~ 1.5
    const contrast   = 1 + a.contrast / 100;   // 0 ~ 2
    const saturation = 1 + a.saturation / 100; // 0 ~ 2
    const tempDeg    = a.temperature * 0.4;    // -40deg ~ +40deg approx
    const presetCss  = (FILTERS.find(f => f.key === state.filter) || {}).css || '';

    canvasImg.style.filter = [
        `brightness(${exposure})`,
        `contrast(${contrast})`,
        `saturate(${saturation})`,
        `hue-rotate(${tempDeg}deg)`,
        presetCss,
    ].join(' ');

    // Vignette via box-shadow inset proxy (cheap)
    const vAlpha = (a.vignette / 100) * 0.7;
    canvasImg.style.boxShadow = `inset 0 0 ${80 + a.vignette * 2}px rgba(0,0,0,${vAlpha})`;
}
function applyTransform() {
    canvasStage.style.transform = `rotate(${state.rotate}deg)`;
}

// ============ History (undo/redo) ============
function pushHistory() {
    state.history.push(JSON.stringify({ adjust: state.adjust, filter: state.filter, rotate: state.rotate, ratio: state.ratio }));
    if (state.history.length > 50) state.history.shift();
    state.future = [];
    updateUndoRedo();
}
function updateUndoRedo() {
    $('undo-btn').disabled = state.history.length < 2;
    $('redo-btn').disabled = state.future.length === 0;
}
$('undo-btn').addEventListener('click', () => {
    if (state.history.length < 2) return;
    state.future.push(state.history.pop());
    const snap = JSON.parse(state.history[state.history.length - 1]);
    Object.assign(state, snap);
    syncUI();
});
$('redo-btn').addEventListener('click', () => {
    if (!state.future.length) return;
    const snap = state.future.pop();
    state.history.push(snap);
    Object.assign(state, JSON.parse(snap));
    syncUI();
});
function syncUI() {
    ADJUSTMENTS.forEach(a => {
        const s = $('slider-' + a.key);
        s.value = state.adjust[a.key];
        $('val-' + a.key).textContent = state.adjust[a.key];
        $('val-' + a.key).classList.toggle('changed', state.adjust[a.key] !== a.def);
        updateSliderFill(s, a);
    });
    document.querySelectorAll('.filter-tile').forEach(t => {
        const is = t.dataset.filter === state.filter;
        t.classList.toggle('active', is);
        t.querySelector('.filter-thumb').classList.toggle('active', is);
    });
    rotateSlider.value = state.rotate;
    $('rotate-val').textContent = state.rotate + '°';
    applyFilters();
    applyTransform();
    applyRatio();
    updateUndoRedo();
}

// ============ Save (rasterize) ============
$('save-btn').addEventListener('click', () => {
    if (!canvasImg.src) { showToast('사진을 먼저 선택하세요'); return; }
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    const img = new Image();
    img.onload = () => {
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        ctx.filter = canvasImg.style.filter || 'none';
        if (state.rotate) {
            ctx.translate(c.width / 2, c.height / 2);
            ctx.rotate(state.rotate * Math.PI / 180);
            ctx.translate(-c.width / 2, -c.height / 2);
        }
        ctx.drawImage(img, 0, 0);
        const url = c.toDataURL('image/jpeg', 0.92);
        const a = document.createElement('a');
        a.href = url; a.download = 'edito-' + Date.now() + '.jpg';
        a.click();
        showToast('💾 저장 완료');
    };
    img.src = canvasImg.src;
});

// ============ Toast + value badge ============
let toastT;
function showToast(msg) {
    clearTimeout(toastT);
    toast.textContent = msg;
    toast.classList.add('show');
    toastT = setTimeout(() => toast.classList.remove('show'), 1800);
}
let badgeT;
function showValueBadge(text) {
    valueBadge.textContent = text;
    valueBadge.classList.add('show');
    clearTimeout(badgeT);
}
function hideValueBadge() {
    badgeT = setTimeout(() => valueBadge.classList.remove('show'), 200);
}

// ============ Back button ============
$('back-btn').addEventListener('click', () => {
    if (history.length > 1) history.back();
    else showToast('이전 화면으로');
});

// initial history snapshot
pushHistory();
</script>
</body>
</html>
